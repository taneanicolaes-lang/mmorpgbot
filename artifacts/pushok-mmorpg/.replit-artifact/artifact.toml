kind = "web"
previewPath = "/"
title = "Пушок — MMORPG"
description = "Русскоязычная фэнтези-MMORPG в Telegram с профилем героя, питомцами, экипировкой, боями, гильдиями и тёмной веб-панелью игрока."
version = "1.0.0"
id = "artifacts/pushok-mmorpg"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18652

[services.development]
run = "pnpm --filter @workspace/pushok-mmorpg run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/pushok-mmorpg", "run", "build" ]
serve = "static"
publicDir = "artifacts/pushok-mmorpg/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18652"
BASE_PATH = "/"
