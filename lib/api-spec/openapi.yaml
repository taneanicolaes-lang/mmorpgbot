openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: game
    description: Игровые данные и действия
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /game/dashboard:
    get:
      operationId: getGameDashboard
      tags: [game]
      summary: Получить обзор мира и героя
      parameters:
        - name: playerId
          in: query
          required: false
          schema: { type: string, default: demo }
      responses:
        "200":
          description: Игровая панель
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameDashboard"
  /game/action:
    post:
      operationId: performGameAction
      tags: [game]
      summary: Выполнить действие в игре
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GameActionInput"
      responses:
        "200":
          description: Результат действия и обновлённое состояние
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameActionResult"
        "400":
          description: Действие невозможно
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /game/auction:
    get:
      operationId: getAuctionListings
      tags: [game]
      summary: Получить активные лоты аукциона
      parameters:
        - name: playerId
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Лоты и комиссия рынка
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuctionListingsResponse"
    post:
      operationId: createAuctionListing
      tags: [game]
      summary: Выставить предмет на аукцион
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAuctionListingInput"
      responses:
        "201":
          description: Лот создан
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuctionActionResult"
        "400":
          description: Предмет нельзя выставить
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /game/auction/{listingId}/buy:
    post:
      operationId: buyAuctionListing
      tags: [game]
      summary: Купить лот у другого игрока
      parameters:
        - name: listingId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuctionPlayerInput"
      responses:
        "200":
          description: Лот куплен
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuctionActionResult"
        "400":
          description: Сделка недоступна
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /game/auction/{listingId}/cancel:
    post:
      operationId: cancelAuctionListing
      tags: [game]
      summary: Снять свой лот с торгов
      parameters:
        - name: listingId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuctionPlayerInput"
      responses:
        "200":
          description: Лот снят с торгов
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuctionActionResult"
        "400":
          description: Лот нельзя снять
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /game/guilds:
    get:
      operationId: getGameGuilds
      tags: [game]
      summary: Получить гильдию игрока, wars и рейтинг
      parameters:
        - name: playerId
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Состояние гильдий игрока
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameGuildDashboard"
        "401":
          description: Игрок не авторизован
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createGameGuild
      tags: [game]
      summary: Создать гильдию
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGameGuildInput"
      responses:
        "201":
          description: Гильдия создана
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameGuildActionResult"
        "400":
          description: Название или состояние игрока недопустимо
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /game/guilds/join:
    post:
      operationId: joinGameGuild
      tags: [game]
      summary: Вступить в открытую гильдию
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JoinGameGuildInput"
      responses:
        "200":
          description: Игрок вступил в гильдию
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameGuildActionResult"
        "400":
          description: Гильдия закрыта или заполнена
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /game/guilds/leave:
    post:
      operationId: leaveGameGuild
      tags: [game]
      summary: Выйти из гильдии
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeaveGameGuildInput"
      responses:
        "200":
          description: Игрок покинул гильдию
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameGuildActionResult"
        "400":
          description: Перед выходом лидер должен передать руководство
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /game/guilds/members:
    post:
      operationId: manageGameGuildMember
      tags: [game]
      summary: Управлять участником гильдии
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManageGameGuildMemberInput"
      responses:
        "200":
          description: Состав гильдии обновлён
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameGuildActionResult"
        "400":
          description: Недостаточно прав
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /game/guilds/leadership:
    post:
      operationId: transferGameGuildLeadership
      tags: [game]
      summary: Передать руководство гильдией
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransferGameGuildLeadershipInput"
      responses:
        "200":
          description: Руководство передано
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameGuildActionResult"
        "400":
          description: Нельзя передать руководство
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /game/guilds/wars:
    post:
      operationId: createGameGuildWar
      tags: [game]
      summary: Объявить войну другой гильдии
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGameGuildWarInput"
      responses:
        "201":
          description: Война началась
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameGuildActionResult"
        "400":
          description: Нельзя начать войну
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /game/guilds/wars/attack:
    post:
      operationId: attackGameGuildWar
      tags: [game]
      summary: Внести вклад в войну гильдий
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttackGameGuildWarInput"
      responses:
        "200":
          description: Вклад учтён
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameGuildActionResult"
        "400":
          description: Игрок уже участвовал или не состоит в воюющей гильдии
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /game/link/start:
    post:
      operationId: startTelegramLink
      tags: [game]
      summary: Создать одноразовый код привязки Telegram
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartTelegramLinkInput"
      responses:
        "200":
          description: Код действует десять минут
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelegramLinkStartResult"
        "400":
          description: Нельзя создать код
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Персонаж уже связан с Telegram
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Слишком частое создание кода
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /game/link/claim:
    post:
      operationId: claimTelegramLink
      tags: [game]
      summary: Подтвердить привязку из Telegram-бота
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClaimTelegramLinkInput"
      responses:
        "200":
          description: Telegram-профиль связан с веб-профилем
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelegramLinkClaimResult"
        "400":
          description: Код истёк или уже использован
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Подтверждение доступно только Telegram-боту
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Нужен выбор персонажа или аккаунт уже связан
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Превышен лимит неверных кодов
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        conflict:
          type: boolean
      required: [error]
    GamePlayer:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        heroClass: { type: string }
        classId: { type: string }
        talentPoints: { type: integer, default: 0 }
        unlockedTalents:
          type: array
          items: { type: string }
        telegramLinked: { type: boolean, default: false }
        level: { type: integer }
        xp: { type: integer }
        xpToNext: { type: integer }
        gold: { type: integer }
        crystals: { type: integer }
        health: { type: integer }
        maxHealth: { type: integer }
        attack: { type: integer }
        realm: { type: string }
        title: { type: string }
        guildName: { type: ["string", "null"] }
        spouseName: { type: ["string", "null"] }
        vip: { type: boolean }
      required: [id, name, heroClass, classId, talentPoints, unlockedTalents, telegramLinked, level, xp, xpToNext, gold, crystals, health, maxHealth, attack, realm, title, guildName, spouseName, vip]
    GameTalent:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        cost: { type: integer }
        requires: { type: ["string", "null"] }
        effectType:
          type: string
          enum: [attack, critical, guard, healing, resource, control]
        effectValue: { type: integer }
      required: [id, name, description, cost, requires, effectType, effectValue]
    TalentBranch:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        talents:
          type: array
          items: { $ref: "#/components/schemas/GameTalent" }
      required: [id, name, description, talents]
    GameClass:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        role: { type: string }
        description: { type: string }
        passive: { type: string }
        branches:
          type: array
          items: { $ref: "#/components/schemas/TalentBranch" }
      required: [id, name, role, description, passive, branches]
    RecipeIngredient:
      type: object
      properties:
        itemId: { type: string }
        name: { type: string }
        quantity: { type: integer }
      required: [itemId, name, quantity]
    GameRecipe:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        requiredLevel: { type: integer }
        goldCost: { type: integer }
        ingredients:
          type: array
          items: { $ref: "#/components/schemas/RecipeIngredient" }
        result: { $ref: "#/components/schemas/GameItem" }
      required: [id, name, description, requiredLevel, goldCost, ingredients, result]
    GameItem:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        icon: { type: string }
        rarity: { type: string }
        category: { type: string }
        equipped: { type: boolean }
        attack: { type: integer }
        defense: { type: integer }
        price: { type: integer }
        quantity: { type: integer }
      required: [id, name, icon, rarity, category, equipped, attack, defense, price, quantity]
    GamePet:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        species: { type: string }
        level: { type: integer }
        rarity: { type: string }
        attack: { type: integer }
        health: { type: integer }
        experience: { type: integer }
        active: { type: boolean }
        vip: { type: boolean }
        evolution: { type: string }
      required: [id, name, species, level, rarity, attack, health, experience, active, vip, evolution]
    MarriageRecord:
      type: object
      properties:
        id: { type: string }
        partnerName: { type: string }
        marriedAt: { type: string, format: date-time }
        divorcedAt: { type: ["string", "null"], format: date-time }
        durationDays: { type: integer }
      required: [id, partnerName, marriedAt, divorcedAt, durationDays]
    GameActivity:
      type: object
      properties:
        id: { type: string }
        message: { type: string }
        category: { type: string }
        createdAt: { type: string, format: date-time }
      required: [id, message, category, createdAt]
    WorldBoss:
      type: object
      properties:
        name: { type: string }
        phase: { type: integer }
        health: { type: integer }
        maxHealth: { type: integer }
        participants: { type: integer }
      required: [name, phase, health, maxHealth, participants]
    LeaderboardEntry:
      type: object
      properties:
        rank: { type: integer }
        name: { type: string }
        heroClass: { type: string }
        level: { type: integer }
        score: { type: integer }
      required: [rank, name, heroClass, level, score]
    ShopItem:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        icon: { type: string }
        description: { type: string }
        price: { type: integer }
        currency: { type: string }
        rarity: { type: string }
      required: [id, name, icon, description, price, currency, rarity]
    GameDashboard:
      type: object
      properties:
        player: { $ref: "#/components/schemas/GamePlayer" }
        inventory:
          type: array
          items: { $ref: "#/components/schemas/GameItem" }
        pets:
          type: array
          items: { $ref: "#/components/schemas/GamePet" }
        marriageHistory:
          type: array
          items: { $ref: "#/components/schemas/MarriageRecord" }
        activity:
          type: array
          items: { $ref: "#/components/schemas/GameActivity" }
        worldBoss: { $ref: "#/components/schemas/WorldBoss" }
        leaderboard:
          type: array
          items: { $ref: "#/components/schemas/LeaderboardEntry" }
        shop:
          type: array
          items: { $ref: "#/components/schemas/ShopItem" }
        classes:
          type: array
          items: { $ref: "#/components/schemas/GameClass" }
        recipes:
          type: array
          items: { $ref: "#/components/schemas/GameRecipe" }
      required: [player, inventory, pets, marriageHistory, activity, worldBoss, leaderboard, shop, classes, recipes]
    GameActionInput:
      type: object
      properties:
        playerId: { type: string }
        playerName: { type: string }
        action:
          type: string
          enum: [register, claim_daily, battle, equip_item, buy_item, feed_pet, evolve_pet, raid_attack, marriage_propose, marriage_divorce, join_guild, select_class, unlock_talent, craft_item]
        targetId: { type: string }
        targetName: { type: string }
      required: [action]
    GameActionResult:
      type: object
      properties:
        message: { type: string }
        dashboard: { $ref: "#/components/schemas/GameDashboard" }
      required: [message, dashboard]
    AuctionListing:
      type: object
      properties:
        id: { type: string, format: uuid }
        sellerName: { type: string }
        item: { $ref: "#/components/schemas/GameItem" }
        quantity: { type: integer }
        price: { type: integer }
        currency:
          type: string
          enum: [gold, crystals]
        isMine: { type: boolean }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
      required: [id, sellerName, item, quantity, price, currency, isMine, createdAt, expiresAt]
    AuctionListingsResponse:
      type: object
      properties:
        listings:
          type: array
          items: { $ref: "#/components/schemas/AuctionListing" }
        feePercent: { type: integer }
      required: [listings, feePercent]
    CreateAuctionListingInput:
      type: object
      properties:
        playerId: { type: string }
        itemId: { type: string }
        quantity: { type: integer, minimum: 1, maximum: 99 }
        price: { type: integer, minimum: 1, maximum: 1000000000 }
        currency:
          type: string
          enum: [gold, crystals]
      required: [playerId, itemId, quantity, price, currency]
    AuctionPlayerInput:
      type: object
      properties:
        playerId: { type: string }
      required: [playerId]
    AuctionActionResult:
      type: object
      properties:
        message: { type: string }
        dashboard: { $ref: "#/components/schemas/GameDashboard" }
      required: [message, dashboard]
    GameGuildSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        rating: { type: integer }
        wins: { type: integer }
        losses: { type: integer }
        memberCount: { type: integer }
      required: [id, name, description, rating, wins, losses, memberCount]
    GameGuildMember:
      type: object
      properties:
        playerId: { type: string }
        name: { type: string }
        heroClass: { type: string }
        level: { type: integer }
        role:
          type: string
          enum: [leader, officer, member]
        joinedAt: { type: string, format: date-time }
      required: [playerId, name, heroClass, level, role, joinedAt]
    GameGuildRank:
      allOf:
        - $ref: "#/components/schemas/GameGuildSummary"
        - type: object
          properties:
            rank: { type: integer }
          required: [rank]
    GameGuildWar:
      type: object
      properties:
        id: { type: string, format: uuid }
        attackerGuildId: { type: string, format: uuid }
        attackerGuildName: { type: string }
        defenderGuildId: { type: string, format: uuid }
        defenderGuildName: { type: string }
        attackerScore: { type: integer }
        defenderScore: { type: integer }
        status:
          type: string
          enum: [active, resolved]
        winnerGuildId: { type: ["string", "null"], format: uuid }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        hasParticipated: { type: boolean }
      required: [id, attackerGuildId, attackerGuildName, defenderGuildId, defenderGuildName, attackerScore, defenderScore, status, winnerGuildId, startsAt, endsAt, hasParticipated]
    GameGuildDashboard:
      type: object
      properties:
        playerGuildId: { type: ["string", "null"], format: uuid }
        yourRole:
          type: ["string", "null"]
          enum: [leader, officer, member, null]
        currentGuild: { oneOf: [{ $ref: "#/components/schemas/GameGuildSummary" }, { type: "null" }] }
        members:
          type: array
          items: { $ref: "#/components/schemas/GameGuildMember" }
        availableGuilds:
          type: array
          items: { $ref: "#/components/schemas/GameGuildSummary" }
        wars:
          type: array
          items: { $ref: "#/components/schemas/GameGuildWar" }
        ranking:
          type: array
          items: { $ref: "#/components/schemas/GameGuildRank" }
      required: [playerGuildId, yourRole, currentGuild, members, availableGuilds, wars, ranking]
    GameGuildActionResult:
      type: object
      properties:
        message: { type: string }
      required: [message]
    CreateGameGuildInput:
      type: object
      properties:
        playerId: { type: string }
        name: { type: string, minLength: 3, maxLength: 32 }
        description: { type: string, maxLength: 200 }
      required: [playerId, name]
    JoinGameGuildInput:
      type: object
      properties:
        playerId: { type: string }
        guildId: { type: string, format: uuid }
      required: [playerId, guildId]
    LeaveGameGuildInput:
      type: object
      properties:
        playerId: { type: string }
      required: [playerId]
    ManageGameGuildMemberInput:
      type: object
      properties:
        playerId: { type: string }
        targetPlayerId: { type: string }
        action:
          type: string
          enum: [promote, demote, remove]
      required: [playerId, targetPlayerId, action]
    TransferGameGuildLeadershipInput:
      type: object
      properties:
        playerId: { type: string }
        targetPlayerId: { type: string }
      required: [playerId, targetPlayerId]
    CreateGameGuildWarInput:
      type: object
      properties:
        playerId: { type: string }
        targetGuildId: { type: string, format: uuid }
      required: [playerId, targetGuildId]
    AttackGameGuildWarInput:
      type: object
      properties:
        playerId: { type: string }
        warId: { type: string, format: uuid }
      required: [playerId, warId]
    StartTelegramLinkInput:
      type: object
      properties:
        playerId: { type: string }
      required: [playerId]
    TelegramLinkStartResult:
      type: object
      properties:
        code: { type: string }
